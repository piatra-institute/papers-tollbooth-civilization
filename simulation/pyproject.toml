[project]
name = "tollbooth-civilization-sim"
version = "0.1.0"
description = "Deterministic model of tolls on a serially dependent stack for Tollbooth Civilization: the Cournot complementary-monopoly collapse, the anticommons in price form, and the non-appropriation principle relating stack depth to sustainable private capture"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]
