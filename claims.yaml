- id: abstract-open-and-integrated
  kind: computation
  evidence:
    file: simulation/output/results.json
    run_id: tolls
    pointer: /serial_tolls/open/welfare
    reported: '0.5'
    decimals: 1
    units: welfare (consumer surplus plus toll revenue) in normalized units
    conditions: linear demand Q = 1 - P on a unit mass of uses; no tolls
  passage: In a normalized market the open stack delivers social value 0.5 and its creators capture nothing;
    a single owner of the whole stack captures 0.25 and halves throughput; two independent tollbooths
    set a higher combined price than a single owner, collect less between them, and leave users worse
    off; twenty tollbooths reduce throughput to about 5 percent of the open level.
