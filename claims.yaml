- id: nordhaus-capture
  kind: source
  evidence:
    citation_id: nordhaus2004
    locator: Abstract; Section C (Conclusion)
    verified: true
    verification_note: NBER Working Paper 10433 (DOI 10.3386/w10433) read from the NBER PDF. The abstract
      covers the non-farm business economy over 1948-2001 and calls the captured share a minuscule fraction;
      the conclusion states that innovators capture about 2.2 percent of the total social surplus from
      innovation.
  passage: Estimating the share of the social surplus from technological advance retained by its producers
    in the United States nonfarm business sector from 1948 to 2001, he found that innovators capture about
    2.2 percent, with the remaining surplus flowing to consumers and to later producers who build on the
    advance.
- id: nordhaus-minuscule
  kind: source
  evidence:
    citation_id: nordhaus2004
    locator: Abstract
    verified: true
    verification_note: The NBER abstract (nber.org/papers/w10433) reads that only a minuscule fraction
      of the social returns from technological advances over 1948-2001 was captured by producers.
  passage: His abstract calls the captured share a minuscule fraction.
- id: hoffmann-oss-value
  kind: source
  evidence:
    citation_id: hoffmann2024
    locator: Abstract
    verified: true
    verification_note: Crossref abstract of DOI 10.2139/ssrn.4693148 (HBS Working Paper 24-038) estimates
      the supply-side value of widely used OSS at $4.15 billion and the demand-side value at $8.8 trillion,
      the latter as a replacement value for each using firm.
  passage: '@hoffmann2024 estimated the cost of rebuilding the freely available software on which firms
    depend and the amount firms would have to pay to replace it, finding a supply-side cost near 4.15
    billion dollars and a demand-side value near 8.8 trillion, a ratio above a thousand between the value
    the software delivers and the cost of the labour that produced it.'
- id: heller-anticommons
  kind: source
  evidence:
    citation_id: heller1998
    locator: Abstract
    verified: true
    verification_note: Abstract of DOI 10.1126/science.280.5364.698 describes an anticommons in biomedical
      research in which people underuse scarce resources because too many owners can block each other.
  passage: This is the tragedy of the anticommons identified by @heller1998 in biomedical research, where
    too many holders of exclusion rights leave a resource underused because each can block the others;
    here it appears in price form.
- id: bresnahan-gpt
  kind: source
  evidence:
    citation_id: bresnahan1995
    locator: Abstract
    verified: true
    verification_note: Abstract of DOI 10.1016/0304-4076(94)01598-T characterizes GPTs by pervasiveness,
      inherent potential for technical improvements and innovational complementarities.
  passage: '@bresnahan1995 named the lower layers general-purpose technologies, defined by pervasiveness
    across sectors, continual improvement, and innovational complementarities that seed advances in every
    field they touch.'
- id: shapiro-thicket
  kind: source
  evidence:
    citation_id: shapiro2001
    locator: Abstract
    verified: true
    verification_note: Abstract of DOI 10.1086/ipe.1.25056143 defines the patent thicket as an overlapping
      set of patent rights requiring those commercializing new technology to obtain licenses from multiple
      patentees. The companion attribution of royalty stacking to Lemley and Shapiro (2007) was not checked
      against that article.
  passage: '@shapiro2001 described the applied version as the patent thicket, the dense overlap of complementary
    rights a product must clear before it can ship, and @lemley2007 named the pricing pathology royalty
    stacking, the accumulation of individually reasonable royalties into an unpayable total.'
- id: romer-nonrival
  kind: source
  evidence:
    citation_id: romer1990
    locator: Abstract
    verified: true
    verification_note: Abstract of DOI 10.1086/261725 states that growth is driven by technological change
      and that technology as an input is a nonrival, partially excludable good.
  passage: '@romer1990 based growth theory on the same property, treating ideas as non-rival inputs whose
    free reuse drives long-run growth because their value is not exhausted by their first holder.'
- id: capture-ratio-definition
  kind: definition
  rationale: Stipulates the two quantities the argument compares; social value is defined against the
    most likely counterfactual absence, so it excludes the value of everything later built on the contribution.
  passage: Define the capture ratio and its inverse, civilizational leverage,
- id: tollbooth-definition
  kind: definition
  rationale: Stipulative; a tollbooth requires both narrowness and unavoidability as stated in the same
    paragraph.
  passage: A tollbooth is a priced chokepoint.
- id: normalized-market
  kind: assumption
  rationale: Linear demand with zero provision cost gives closed forms; the robustness study relaxes the
    curvature to (1-P)^theta and finds the orderings unchanged.
  passage: Normalize the market to a unit mass of potential uses (packets, transactions, or new products),
    each with willingness to pay drawn uniformly on the interval from zero to one, and no cost of provision
    beyond the tolls, so that demand for the stack at total per-use price $P$ is $Q(P) = 1 - P$.
- id: perfect-complements-credit
  kind: assumption
  rationale: Treats each layer as a necessary condition for the whole surplus, which gives the upper bound
    on the capture ratio's denominator; a smaller credited surplus would raise kappa proportionally.
  passage: Crediting the layer with the entire open surplus of 0.5, for which each perfect complement
    is a necessary condition, the capture ratio and leverage are
- id: not-a-calibration
  kind: interpretation
  rationale: The 22.7-layer match between the stipulated model and Nordhaus's measured share is a coincidence
    of magnitudes, not a fitted parameter; the paper does not infer stack depth from it.
  passage: This is not a calibration, although the coincidence between a stipulated model and a measured
    economy is notable.
- id: factor-40
  kind: interpretation
  rationale: Derived from the Nordhaus share, 1/0.022 = 45.5; the comparison applies an aggregate economy-wide
    ratio to the reading of wealth rankings.
  passage: 'Against a list of the wealthiest people, the finding implies more than modest underpayment:
    the quantity a wealth ranking measures and the quantity it is taken to measure differ, and the second
    exceeds the first by a factor of more than 40.'
- id: remainder-98
  kind: interpretation
  rationale: 'Complement of the Nordhaus share: 100 - 2.2 = 97.8 percent.'
  passage: Producers retain little of the surplus, and the remainder, about 98 percent, reaches everyone
    else, which is the form in which a foundational technology delivers value.
- id: packet-toll-arithmetic
  kind: interpretation
  rationale: Thought experiment; the packet count is an order-of-magnitude assumption that the paper states
    cannot be audited, and the product is exact arithmetic ($10^{-4}$ times $10^{19}$).
  passage: The number cannot be audited, but the internet has carried on the order of $10^{18}$ to $10^{19}$
    packets, and a hundredth of a cent on $10^{19}$ packets is $10^{15}$ dollars, a quadrillion.
- id: ownership-ranking
  kind: interpretation
  rationale: Reads the model's welfare ordering (0.5 > 0.375 > fragmented values) as a limit on the argument;
    it holds for every positive curvature in the robustness study.
  passage: Openness ranks first, integration second, and fragmentation last, so the model does not establish
    that all ownership is illegitimate.
- id: policy-open-layers
  kind: normative
  rationale: A policy recommendation that follows from the model's welfare ranking together with the paper's
    acceptance that appropriability funds invention; it is not derived from the model alone.
  passage: Policy should favour keeping foundational layers open, collect public returns at the level
    of the firm or portfolio in preference to a tax on each use of a primitive, and distinguish the second-best
    of integration from the creation of the underlying layers.
