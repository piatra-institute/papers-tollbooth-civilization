abstract: "Rankings of private wealth are read as rankings of contribution to civilization, and the reading is wrong in a way that has structure. Work becomes foundational by becoming non-excludable, standardized, cheap to copy, and depended upon by everything above it, and each of those properties is what stops its creator from charging for it. The people whose work became the substrate of modern technology, the designers of the internet's transport protocol, the metal-oxide-semiconductor transistor, the small public-domain database inside most devices, the salt-and-sugar formula that rehydrates a dying child, captured almost none of the value their work carries, and they captured almost none of it because the work became foundational. This paper models a technological civilization as a stack of serially dependent layers, each able to levy a per-use toll, and computes what tolls do to it. In a normalized market the open, untolled stack delivers social value 0.5 and its creators keep nothing; a single owner of the whole stack keeps 0.25 while halving throughput; and when the stack is split among independent tollbooths the tolls compound, so that two booths set a higher combined price than one owner would and collect less between them while users are worse off, and twenty booths cut throughput to about 5 percent of the open level. The sustainable private capture of any one foundational layer falls as 1/(2N) in the number of complementary layers, so the model's capturable fraction reaches the roughly 2.2 percent of social surplus that Nordhaus estimated innovators actually capture near a stack 23 layers deep. The configuration that maximizes social value is the one in which creators capture nothing. Great fortunes form instead at the narrower, more excludable layers above the commons, where control over a point that use must pass through can be turned into recurring revenue, and ownership of such a point is then narrated as though it were the building of the road beneath it. The paper is careful about what this does and does not license: appropriability drives real invention, integration and scaling are real work, and a single integrated owner does less damage than a fragmented anticommons. The claim is the systematic divergence between contribution and capture, and the mistaking of the tollbooth for the road."
